<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayarlar — VESİLE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}">
</head>

<body>
    <div class="settings-shell">
        <header class="settings-header">
            <a href="{{ url_for('profile') }}" class="settings-back" aria-label="Profil sayfasına dön">
                <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            <h1 class="settings-title">Ayarlar</h1>
        </header>

        <main class="settings-main">
            <section class="settings-group" aria-labelledby="settings-account-label">
                <h2 class="settings-group-label" id="settings-account-label">HESAP</h2>
                <ul class="settings-list">
                    <li>
                        <div class="settings-row settings-row--inactive" aria-disabled="true">
                            <span class="settings-row-icon" aria-hidden="true">
                                <svg width="20" height="20" viewBox="0 0 24 24">
                                    <circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
                                    <path d="M4.5 19c.8-2.8 2.6-4.2 4.5-4.2s3.7 1.4 4.5 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                    <path d="M16.5 7.5l3.5 3.5M20 4v3.5H16.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            <span class="settings-row-label">Profili Düzenle</span>
                            <span class="settings-row-chevron" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 24 24">
                                    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </div>
                    </li>
                    <li>
                        <div class="settings-row settings-row--inactive" aria-disabled="true">
                            <span class="settings-row-icon" aria-hidden="true">
                                <svg width="20" height="20" viewBox="0 0 24 24">
                                    <rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
                                    <path d="M8 11V8a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="settings-row-label">Şifreyi Değiştir</span>
                            <span class="settings-row-chevron" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 24 24">
                                    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </div>
                    </li>
                </ul>
            </section>

            <section class="settings-group" aria-labelledby="settings-notifications-label">
                <h2 class="settings-group-label" id="settings-notifications-label">BİLDİRİMLER</h2>
                <ul class="settings-list">
                    <li>
                        <div class="settings-row settings-row--inactive" aria-disabled="true">
                            <span class="settings-row-icon" aria-hidden="true">
                                <svg width="20" height="20" viewBox="0 0 24 24">
                                    <path d="M6 8a6 6 0 1112 0c0 7 3 7 3 9H3c0-2 3-2 3-9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                                    <path d="M10 20a2 2 0 004 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="settings-row-label">Bildirim Ayarları</span>
                            <span class="settings-row-chevron" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 24 24">
                                    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </div>
                    </li>
                </ul>
            </section>

            <section class="settings-group" aria-labelledby="settings-support-label">
                <h2 class="settings-group-label" id="settings-support-label">DESTEK VE BİLGİ</h2>
                <ul class="settings-list">
                    <li>
                        <div class="settings-row settings-row--inactive" aria-disabled="true">
                            <span class="settings-row-icon" aria-hidden="true">
                                <svg width="20" height="20" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
                                    <path d="M12 10.2v5.2M12 8.1h.01" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="settings-row-label">Hakkında</span>
                            <span class="settings-row-chevron" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 24 24">
                                    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </div>
                    </li>
                    <li>
                        <div class="settings-row settings-row--inactive" aria-disabled="true">
                            <span class="settings-row-icon" aria-hidden="true">
                                <svg width="20" height="20" viewBox="0 0 24 24">
                                    <path d="M12 3l7 3.5V11c0 4.2-3 7.8-7 9-4-1.2-7-4.8-7-9V6.5L12 3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                                    <circle cx="12" cy="11.5" r="1.2" fill="currentColor"/>
                                    <path d="M12 13v2.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="settings-row-label">Gizlilik Politikası</span>
                            <span class="settings-row-chevron" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 24 24">
                                    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </div>
                    </li>
                    <li>
                        <div class="settings-row settings-row--inactive" aria-disabled="true">
                            <span class="settings-row-icon" aria-hidden="true">
                                <svg width="20" height="20" viewBox="0 0 24 24">
                                    <path d="M8 4h8l2 3v13H6V7l2-3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                                    <path d="M9 9h6M9 13h6M9 17h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="settings-row-label">Kullanım Koşulları</span>
                            <span class="settings-row-chevron" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 24 24">
                                    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </div>
                    </li>
                </ul>
            </section>

            <section class="settings-actions" aria-label="Hesap işlemleri">
                <a href="{{ url_for('logout') }}" class="settings-action settings-action--logout">Çıkış Yap</a>
                <span class="settings-action settings-action--delete" aria-disabled="true">Hesabı Sil</span>
            </section>
        </main>
    </div>
</body>

</html>
