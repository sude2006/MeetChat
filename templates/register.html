<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol — MeetChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <div class="login-shell">
        <div class="decor decor-tl" aria-hidden="true"></div>
        <div class="decor decor-tr" aria-hidden="true"></div>
        <div class="decor decor-bl" aria-hidden="true"></div>
        <div class="decor decor-br" aria-hidden="true"></div>

        <div class="login-content">
            <div class="brand">
                <svg class="brand-logo" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
                    <circle cx="14" cy="14" r="6" fill="#FF465B"/>
                    <circle cx="30" cy="14" r="6" fill="#61EAD5"/>
                    <path d="M8 32c2.5-6 7-9 14-9s11.5 3 14 9" fill="none" stroke="#FF465B" stroke-width="3" stroke-linecap="round"/>
                    <path d="M10 34c2-4.5 5.5-7 12-7" fill="none" stroke="#61EAD5" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span class="brand-name"><span class="brand-meet">Meet</span><span class="brand-chat">Chat</span></span>
            </div>

            <header class="login-header">
                <h1>Kayıt Ol</h1>
                <p>Zaten hesabın var mı? <a href="{{ url_for('login') }}">Giriş Yap</a></p>
            </header>

            <form class="login-form" action="{{ url_for('register') }}" method="post">
                {% if error %}
                <p class="form-error" role="alert">{{ error }}</p>
                {% endif %}

                <label class="field">
                    <span class="field-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M4 20c1.5-3.5 4-5 8-5s6.5 1.5 8 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <input type="text" name="name" placeholder="Ad Soyad" autocomplete="name" value="{{ form_data.name if form_data is defined else '' }}">
                </label>

                <label class="field">
                    <span class="field-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M3 7l9 7 9-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <input type="email" name="email" placeholder="E-posta" autocomplete="email" value="{{ form_data.email if form_data is defined else '' }}">
                </label>

                <label class="field">
                    <span class="field-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M8 10V7a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <input type="password" name="password" placeholder="Şifre" autocomplete="new-password" id="password-input">
                    <button type="button" class="toggle-password" aria-label="Şifreyi göster" data-target="password-input">
                        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                    </button>
                </label>

                <label class="field">
                    <span class="field-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M8 10V7a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <input type="password" name="password_confirm" placeholder="Şifre Tekrar" autocomplete="new-password" id="password-confirm-input">
                    <button type="button" class="toggle-password" aria-label="Şifreyi göster" data-target="password-confirm-input">
                        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                    </button>
                </label>

                <p class="password-hint">
                    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                        <circle cx="8" cy="8" r="7" fill="#61EAD5"/>
                        <path d="M4.5 8l2.2 2.2L11.5 5.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Şifreniz en az 8 karakter olmalıdır.</span>
                </p>

                <button type="submit" class="login-btn">Kayıt Ol</button>
            </form>
        </div>
    </div>

    <script>
        (function () {
            document.querySelectorAll(".toggle-password").forEach(function (toggle) {
                toggle.addEventListener("click", function () {
                    var input = document.getElementById(toggle.getAttribute("data-target"));
                    if (!input) return;
                    var show = input.type === "password";
                    input.type = show ? "text" : "password";
                    toggle.setAttribute("aria-label", show ? "Şifreyi gizle" : "Şifreyi göster");
                });
            });
        })();
    </script>
</body>

</html>
