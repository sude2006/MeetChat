<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Giriş Yap — VESİLE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <div class="login-shell">
        <div class="decor-layer" aria-hidden="true">
            <div class="decor decor-tl"></div>
            <div class="decor decor-tr"></div>
        </div>

        <div class="login-content">
            <div class="brand">
                <svg class="brand-logo" width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
                    <rect width="42" height="42" rx="11" fill="currentColor"/>
                    <path fill="#FFFFFF" d="M15.2 8.4l1.72 4.62 4.62 1.72-4.62 1.72-1.72 4.62-1.72-4.62-4.62-1.72 4.62-1.72z"/>
                    <path fill="#FFFFFF" d="M28.4 16.1l1.05 2.82 2.82 1.05-2.82 1.05-1.05 2.82-1.05-2.82-2.82-1.05 2.82-1.05z"/>
                    <path fill="#FFFFFF" d="M23.6 24.2l.88 2.36 2.36.88-2.36.88-.88 2.36-.88-2.36-2.36-.88 2.36-.88z"/>
                </svg>
                <span class="brand-name">VESİLE</span>
            </div>

            <header class="login-header">
                <h1>Giriş Yap</h1>
                <p>Hesabın yok mu? <a href="{{ url_for('register') }}">Kayıt Ol</a></p>
            </header>

            <form class="login-form" action="{{ url_for('login') }}" method="post">
                {% if error %}
                <p class="form-error" role="alert">{{ error }}</p>
                {% endif %}

                <label class="field">
                    <span class="field-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M3 7l9 7 9-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <input type="email" name="email" placeholder="E-posta" autocomplete="email" value="{{ form_data.email if form_data is defined else '' }}">
                </label>

                <label class="field">
                    <span class="field-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M8 10V7a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <input type="password" name="password" placeholder="Şifre" autocomplete="current-password" id="password-input">
                    <button type="button" class="toggle-password" aria-label="Şifreyi göster" id="toggle-password">
                        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                    </button>
                </label>

                <div class="form-meta">
                    <a href="#" class="forgot-link">Şifremi Unuttum</a>
                </div>

                <button type="submit" class="login-btn">Giriş Yap</button>
            </form>
        </div>
    </div>

    <script>
        (function () {
            var input = document.getElementById("password-input");
            var toggle = document.getElementById("toggle-password");
            if (!input || !toggle) return;
            toggle.addEventListener("click", function () {
                var show = input.type === "password";
                input.type = show ? "text" : "password";
                toggle.setAttribute("aria-label", show ? "Şifreyi gizle" : "Şifreyi göster");
            });
        })();
    </script>
</body>

</html>
